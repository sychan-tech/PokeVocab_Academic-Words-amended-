<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéVocab: Academic Catcher</title>
    <!-- MediaPipe Hands and Camera Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: white; text-align: center; overflow-x: hidden; }
        
        #app-header { margin-top: 15px; }
        h1 { color: #facc15; text-shadow: 3px 3px 0 #dc2626; font-size: 2.5rem; letter-spacing: 2px; }
        .subtitle { color: #38bdf8; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; }

        /* Lobby UI */
        .card { background: #1e293b; max-width: 450px; margin: 20px auto; padding: 25px; border-radius: 16px; border: 3px solid #38bdf8; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        input { width: 85%; padding: 12px; margin: 10px 0; font-size: 1rem; border-radius: 8px; border: 2px solid #38bdf8; background: #0f172a; color: white; text-align: center; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
        button { padding: 12px 20px; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-red { background: #ef4444; color: white; }
        .btn-yellow { background: #eab308; color: black; }
        button:hover { transform: scale(1.05); }

        /* Game Arena */
        #game-screen { display: none; position: relative; width: 100vw; max-width: 900px; margin: 0 auto; }
        #hud { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 20px; border-radius: 12px; margin-bottom: 10px; border: 2px solid #facc15; }
        .hud-item { font-size: 1.1rem; font-weight: bold; }
        
        #canvas-container { position: relative; width: 100%; height: 500px; border-radius: 16px; overflow: hidden; border: 4px solid #facc15; background: #0284c7; }
        video { display: none; }
        canvas { width: 100%; height: 100%; }

        #room-info { margin-top: 10px; color: #94a3b8; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="app-header">
        <h1>POKEVOCAB</h1>
        <div class="subtitle">Academic Catcher</div>
    </div>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="card">
        <p style="margin-bottom: 12px; color: #cbd5e1;">Wave hands to catch the correct ACADEMIC word and save 20 Pokémon!</p>
        <input type="text" id="player-name" placeholder="Enter Student Name" autocomplete="off">
        <input type="text" id="room-code-input" placeholder="ROOM CODE (TO JOIN)" style="display:none;" autocomplete="off">
        
        <div class="btn-group">
            <button class="btn-red" id="create-btn">Create Room</button>
            <button class="btn-yellow" id="join-btn">Join Room</button>
        </div>
        <div id="lobby-status" style="margin-top: 15px; color: #facc15; font-weight: bold;"></div>
    </div>

    <!-- GAME PLAY SCREEN -->
    <div id="game-screen">
        <div id="hud">
            <div class="hud-item" style="color:#38bdf8;" id="hud-player">Player: -</div>
            <div class="hud-item" style="color:#facc15;" id="hud-players-count">Players: 1</div>
            <div class="hud-item" style="color:#4ade80;" id="hud-saved">Saved: 0/20</div>
            <div class="hud-item" style="color:#f43f5e;" id="hud-timer">Time: 0s</div>
        </div>

        <div id="canvas-container">
            <video id="webcam" autoplay playsinline></video>
            <canvas id="game-canvas"></canvas>
        </div>
        <div id="room-info">Room Code: <span id="current-room-tag" style="color:#facc15;">-</span></div>
    </div>

    <script>
        // 20 ACADEMIC VOCABULARY QUESTIONS BASED ON P2/P5 MATERIALS
        const vocabularyData = [
            { prompt: "unimportant", options: ["trivial", "small"], correct: ["trivial"] },[cite: 1]
            { prompt: "drop", options: ["decline", "fall"], correct: ["decline"] },[cite: 1]
            { prompt: "help", options: ["aid", "assist"], correct: ["aid", "assist"] },[cite: 1]
            { prompt: "use", options: ["utilise", "apply"], correct: ["utilise", "apply"] },[cite: 1]
            { prompt: "do", options: ["attempt", "attend"], correct: ["attempt"] },[cite: 1]
            { prompt: "the whole world", options: ["earth", "globe"], correct: ["globe"] },[cite: 1]
            { prompt: "yearly", options: ["annual", "daily"], correct: ["annual"] },[cite: 1]
            { prompt: "aim / goal", options: ["target", "route"], correct: ["target"] },[cite: 1]
            { prompt: "change", options: ["modify", "fix"], correct: ["modify"] },[cite: 1]
            { prompt: "stage / step", options: ["phase", "block"], correct: ["phase"] },[cite: 1]
            { prompt: "show", options: ["display", "hide"], correct: ["display"] },[cite: 1]
            { prompt: "huge / very big", options: ["enormous", "tiny"], correct: ["enormous"] },[cite: 1]
            { prompt: "start / set up", options: ["establish", "stop"], correct: ["establish"] },[cite: 1]
            { prompt: "look into / study", options: ["investigate", "ignore"], correct: ["investigate"] },[cite: 1]
            { prompt: "part / factor", options: ["element", "whole"], correct: ["element"] },[cite: 1]
            { prompt: "produce / create", options: ["generate", "destroy"], correct: ["generate"] },[cite: 1]
            { prompt: "way / path", options: ["route", "wall"], correct: ["route"] },[cite: 1]
            { prompt: "money charged", options: ["fee", "gift"], correct: ["fee"] },[cite: 1]
            { prompt: "special / unique", options: ["unique", "common"], correct: ["unique"] },[cite: 1]
            { prompt: "give help / support", options: ["promote", "hinder"], correct: ["promote"] }[cite: 1]
        ];

        // LOCAL MULTIPLAYER & GAME STATE
        let roomCode = "";
        let playerName = "";
        let playerCount = 1;
        let currentQIndex = 0;
        let savedCount = 0;
        let startTime = 0;
        let timerInterval = null;
        let broadcastChannel = null;

        // GAME CANVAS & ANIMATION
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let catcherX = 400;
        let fallingItems = [];
        let savedPokemonList = [];

        // DOM ELEMENTS
        const playerNameInput = document.getElementById('player-name');
        const roomCodeInput = document.getElementById('room-code-input');
        const createBtn = document.getElementById('create-btn');
        const joinBtn = document.getElementById('join-btn');
        const lobbyStatus = document.getElementById('lobby-status');

        // MULTIPLAYER ROOM CREATION / JOINING (Zero Firebase Dependencies)
        createBtn.onclick = () => {
            playerName = playerNameInput.value.trim() || "Trainer";
            roomCode = "POKE-" + Math.floor(1000 + Math.random() * 9000);
            initRoom();
        };

        joinBtn.onclick = () => {
            if (roomCodeInput.style.display === "none") {
                roomCodeInput.style.display = "inline-block";
                lobbyStatus.innerText = "Enter Room Code and click Join Room again.";
                return;
            }
            playerName = playerNameInput.value.trim() || "Trainer";
            roomCode = roomCodeInput.value.trim().toUpperCase() || "POKE-1001";
            initRoom();
        };

        function initRoom() {
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('hud-player').innerText = `Player: ${playerName}`;
            document.getElementById('current-room-tag').innerText = roomCode;

            // Connect local cross-tab communication channel for classroom setup
            try {
                broadcastChannel = new BroadcastChannel(`room_${roomCode}`);
                broadcastChannel.postMessage({ type: 'JOIN', name: playerName });
                broadcastChannel.onmessage = (e) => {
                    if (e.data.type === 'JOIN') {
                        playerCount++;
                        document.getElementById('hud-players-count').innerText = `Players: ${playerCount}`;
                        broadcastChannel.postMessage({ type: 'ACK', count: playerCount });
                    } else if (e.data.type === 'ACK') {
                        playerCount = Math.max(playerCount, e.data.count);
                        document.getElementById('hud-players-count').innerText = `Players: ${playerCount}`;
                    }
                };
            } catch(err) { console.log("BroadcastChannel offline fallback mode active."); }

            startCameraAndGame();
        }

        // MEDIAPIPE HAND TRACKING & WEBCAM
        const videoElement = document.getElementById('webcam');
        
        function startCameraAndGame() {
            canvas.width = 800;
            canvas.height = 500;

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandResults);

            const camera = new Camera(videoElement, {
                onFrame: async () => { await hands.send({ image: videoElement }); },
                width: 640,
                height: 480
            });

            camera.start().catch(() => {
                lobbyStatus.innerText = "Webcam not detected, using mouse fallback control.";
            });

            // Mouse fallback option
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                catcherX = (e.clientX - rect.left) * (canvas.width / rect.width);
            });

            // Start Timer & Game Loop
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
            spawnQuestion(currentQIndex);
            requestAnimationFrame(gameLoop);
        }

        function onHandResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const hand = results.multiHandLandmarks[0];
                // Use wrist landmark (index 0) or palm center for positioning
                const handX = hand[0].x; 
                // Mirrored control: waving right moves right
                catcherX = (1 - handX) * canvas.width;
            }
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('hud-timer').innerText = `Time: ${elapsed}s`;
        }

        function spawnQuestion(index) {
            if (index >= vocabularyData.length) return;
            const q = vocabularyData[index];
            fallingItems = [
                { text: q.options[0], x: 250, y: 50, speed: 2, isCorrect: q.correct.includes(q.options[0]) },
                { text: q.options[1], x: 550, y: 50, speed: 2, isCorrect: q.correct.includes(q.options[1]) }
            ];
        }

        // MAIN RENDER & GAME ENGINE
        function gameLoop() {
            // Draw Background & Sky
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grass Area at Bottom
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(0, canvas.height - 70, canvas.width, 70);

            // Display Saved Pokémon on Grass
            savedPokemonList.forEach((poke, idx) => {
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(30 + (idx * 38), canvas.height - 35, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px sans-serif';
                ctx.fillText(' Poké', 18 + (idx * 38), canvas.height - 31);
            });

            // Render Current Question Prompt
            if (currentQIndex < vocabularyData.length) {
                const q = vocabularyData[currentQIndex];
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(150, 15, 500, 45);
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 3;
                ctx.strokeRect(150, 15, 500, 45);

                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText(`Replace word: "${q.prompt.toUpperCase()}"`, 400, 43);

                // Update and Render Falling Items
                fallingItems.forEach(item => {
                    item.y += item.speed;

                    // Draw Pokéball option container
                    ctx.fillStyle = item.isCorrect ? '#ef4444' : '#3b82f6';
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, 35, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 16px sans-serif';
                    ctx.fillText(item.text, item.x, item.y + 5);

                    // Collision Detection with Net Catcher
                    if (item.y >= canvas.height - 110 && Math.abs(item.x - catcherX) < 55) {
                        if (item.isCorrect) {
                            savedCount++;
                            savedPokemonList.push(item.text);
                            document.getElementById('hud-saved').innerText = `Saved: ${savedCount}/20`;
                            currentQIndex++;
                            if (currentQIndex < vocabularyData.length) {
                                spawnQuestion(currentQIndex);
                            }
                        } else {
                            // Reset item position on miss
                            item.y = 50;
                        }
                    } else if (item.y > canvas.height - 70) {
                        item.y = 50; // Loop falling
                    }
                });
            } else {
                // GAME COMPLETE SCREEN
                clearInterval(timerInterval);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#facc15';
                ctx.font = 'bold 36px sans-serif';
                ctx.fillText('ALL 20 POKÉMON SAVED!', 400, 220);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 22px sans-serif';
                ctx.fillText(`Great job ${playerName}! Final Time: ${document.getElementById('hud-timer').innerText}`, 400, 280);
            }

            // Draw Hand Gesture Player Catcher Net
            ctx.fillStyle = '#facc15';
            ctx.beginPath();
            ctx.arc(catcherX, canvas.height - 80, 45, 0, Math.PI, false);
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#dc2626';
            ctx.stroke();

            requestAnimationFrame(gameLoop);
        }

        ctx.textAlign = 'center';
    </script>
</body>
</html>
